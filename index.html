<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프레이피스 캐릭터 서고</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: 서고(아카이브) 서랍. 위에 제목과 룰 서랍 탭, 아래는 인물 카드 격자, 카드를 누르면 서류철 같은 상세 패널. */
:root{
  --bg:#14171c; --panel:#1c2027; --raise:#232833; --line:#323846;
  --fg:#e9e4d8; --muted:#9b9a94; --accent:#c9a15b; --accent-ink:#1a1408;
  --coc:#6f9a7c; --coc2:#4f9aa0; --uw:#6c8fc4; --sg:#c46c6c; --etc:#a184c4; --e1:#c49a5c; --e2:#b97a9a; --e3:#8f9aa8;
  --display:"Nanum Myeongjo", "Noto Serif KR", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eeebe3; --panel:#f8f6f0; --raise:#ffffff; --line:#d6d1c4;
  --fg:#22231f; --muted:#6b6a63; --accent:#8a6424; --accent-ink:#fff8ea;
  --coc:#3f7352; --coc2:#2f7479; --uw:#3d64a0; --sg:#a14545; --etc:#77579e; --e1:#8a6424; --e2:#8f4d6e; --e3:#5a6472; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eeebe3; --panel:#f8f6f0; --raise:#ffffff; --line:#d6d1c4;
  --fg:#22231f; --muted:#6b6a63; --accent:#8a6424; --accent-ink:#fff8ea;
  --coc:#3f7352; --coc2:#2f7479; --uw:#3d64a0; --sg:#a14545; --etc:#77579e; --e1:#8a6424; --e2:#8f4d6e; --e3:#5a6472; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:40px 20px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.15;margin:.2em 0 .25em;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;background:none;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:4px;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-pressed="true"]{color:var(--fg);border-color:var(--line);background:var(--panel)}
.tab .n{font-family:var(--mono);font-size:12px;margin-left:6px;color:var(--muted)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 6px}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.tools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
input{width:min(240px,60vw)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:border-color .2s, transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph{aspect-ratio:3/4;max-width:100%;background:var(--raise);position:relative;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top center}
.ph .ini{font-family:var(--display);font-size:44px;color:var(--line)}
.ph .rule{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:2px 7px;border-radius:3px;color:#fff;background:var(--c)}
.ph .st{position:absolute;right:8px;top:8px;font-size:11px;padding:2px 7px;border-radius:3px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .nm{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.3}
.card .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.lost .ph img{filter:grayscale(.85) brightness(.8)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
/* detail */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.file{width:min(920px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);overflow:hidden;position:relative}
.file .big{background:var(--raise);min-height:300px;display:flex;align-items:flex-start;justify-content:center}
.file .big>*{position:sticky;top:0}
.file .big img{width:100%;height:100%;object-fit:contain;object-position:top}
.file .big .ini{font-family:var(--display);font-size:90px;color:var(--line)}
.file .body{padding:28px 28px 32px;min-width:0;display:flex;flex-direction:column;gap:18px}
.close{position:absolute;right:10px;top:10px;font:inherit;font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.file h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
.alias{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.r{color:#fff;border-color:transparent;background:var(--c);font-family:var(--mono)}
blockquote{margin:0;padding:10px 0 10px 16px;border-left:2px solid var(--accent);font-family:var(--display);font-size:17px;line-height:1.6}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;font-size:14px}
dt{color:var(--muted);font-size:13px}
dd{margin:0;min-width:0}
.sec h3{font-size:12px;font-family:var(--mono);letter-spacing:.14em;color:var(--accent);margin:0 0 6px;font-weight:500}
.sec p{margin:0;white-space:pre-line;max-width:65ch}
.sec ol{margin:0;padding-left:1.3em}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.lockbtn{font:inherit;font-size:13px;margin-top:16px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.lockbtn:hover{border-color:var(--accent)}
#logs{padding-block:24px 64px}
#logs h2{font-family:var(--display);font-size:24px;margin:0 0 6px}
.logbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.log{border-collapse:collapse;width:100%;font-size:13.5px;min-width:760px}
table.log th,table.log td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.log th{font-weight:500;color:var(--muted);font-size:12px;background:var(--panel);position:sticky;top:0}
table.log td.n{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
table.log a{color:var(--accent)}
.msg{color:var(--muted);font-size:14px}
.sess li{margin-bottom:4px}
.sess .who{color:var(--muted);font-size:13px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-block:20px}
@media (max-width:700px){.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.tab{white-space:nowrap}.file{grid-template-columns:1fr}.file .big{max-height:60vh}.tools{margin-left:0;width:100%}input{flex:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="eyebrow">Praypeace · Character Archive</div>
  <h1>프레이피스 캐릭터 서고</h1>
  <p class="lede">지금까지 탁자 위에서 살았던 인물들. 1920년대 아캄부터 지금의 도시, 언리미티드 월드와 여러 룰까지, 한 명씩 꺼내 볼 수 있게 모아 두었습니다.</p>
  <div class="stats" id="stats"></div>
  <button class="lockbtn" id="logbtn" type="button">세션 로그 (비공개)</button>
</div></header>

<div class="bar"><div class="wrap">
  <div class="tabs" id="tabs" role="group" aria-label="룰"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="이름, 직업, 시나리오 검색" aria-label="검색">
    <select id="st" aria-label="상태"><option value="">모든 상태</option><option value="생존">생존</option><option value="lost">로스트·사망</option><option value="etc">그 밖</option></select>
    <select id="sort" aria-label="정렬"><option value="img">그림 있는 인물 먼저</option><option value="id">룰·시대 순</option><option value="name">이름 순</option><option value="plays">시나리오 많은 순</option></select>
  </div>
</div></div>

<section class="wrap" id="logs" hidden>
  <h2>세션 로그</h2>
  <p class="msg">키퍼와 플레이어가 적힌 비공개 기록이에요. 비밀번호가 있어야 보여요.</p>
  <form class="logbar" id="pwform"><input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password"><button class="lockbtn" type="submit" style="margin:0">열기</button><span class="msg" id="pwmsg"></span></form>
  <div id="logbody" hidden><div class="logbar"><input id="lq" type="search" placeholder="시나리오, 키퍼, 플레이어, 캐릭터 검색" aria-label="세션 검색"><button class="lockbtn" type="button" id="logclose" style="margin:0">캐릭터로 돌아가기</button></div><div class="tblwrap"><table class="log"><thead><tr><th>번호</th><th>시나리오</th><th>룰</th><th>키퍼</th><th>플레이어</th><th>내 캐릭터</th><th>날짜</th><th>녹화</th><th>영상</th><th>기록</th></tr></thead><tbody id="logrows"></tbody></table></div></div>
</section>
<main class="wrap" id="mainlist"><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>조건에 맞는 인물이 없어요.</p></main>
<footer><div class="wrap">◈프레이피스 캐릭터 모음집에서 자동으로 옮겨 오는 서고입니다.</div></footer>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="dname"></div>

<script>
const RULES={CoC1920:{name:'CoC 1920년대',tag:'CoC 1920',c:'var(--coc)'},CoC현대:{name:'CoC 현대',tag:'CoC 현대',c:'var(--coc2)'},UW:{name:'언리미티드 월드',tag:'UW',c:'var(--uw)'},
SG:{name:'시노비가미',tag:'시노비가미',c:'var(--sg)'},저녁노을:{name:'저녁노을 어스름',tag:'저녁노을',c:'var(--e1)'},에모크로아:{name:'에모크로아',tag:'에모크로아',c:'var(--etc)'},
던전월드:{name:'던전 월드',tag:'던전월드',c:'var(--e2)'},아곤:{name:'아곤·조선 아곤',tag:'아곤',c:'var(--e1)'},둘수사:{name:'둘이서 수사',tag:'둘수사',c:'var(--e3)'},
너냐:{name:'너냐?!',tag:'너냐?!',c:'var(--e2)'},인세인:{name:'인세인',tag:'인세인',c:'var(--sg)'},델타그린:{name:'델타 그린',tag:'델타그린',c:'var(--coc2)'},
무협:{name:'무협',tag:'무협',c:'var(--e3)'},탐공사:{name:'탐공사',tag:'탐공사',c:'var(--etc)'},피아스코:{name:'피아스코',tag:'피아스코',c:'var(--e2)'},
TA:{name:'트라이앵글 에이전시',tag:'TA',c:'var(--e3)'},'1시간히어로':{name:'1시간 히어로',tag:'1시간 히어로',c:'var(--e1)'},미분류:{name:'시트 없음·정리 필요',tag:'미분류',c:'var(--muted)'},기타:{name:'그 밖의 룰',tag:'기타',c:'var(--muted)'}};
const MAIN=['CoC1920','CoC현대','UW'];
const LOST=/로스트|사망|격리|모험불가/;
let DATA=[],rule='',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plays=d=>+d['시나리오횟수']||(d['시나리오']||[]).length||0;
function sub(d){return [d['직업'],d['나이']&&(d['나이']+(/\d$/.test(d['나이'])?'세':'')),d['시대']].filter(Boolean).join(' · ')}
function ph(d,cls){return d.img?`<img src="${d.img}" alt="${esc(d['이름'])}" loading="lazy">`:`<span class="ini">${esc((d['이름']||'?')[0])}</span>`}
function render(){
  const q=$('#q').value.trim().toLowerCase(),st=$('#st').value,so=$('#sort').value;
  let list=DATA.filter(d=>(!rule||d['서가']===rule)
    &&(!st||(st==='생존'?d['상태']==='생존':st==='lost'?LOST.test(d['상태']):d['상태']!=='생존'&&!LOST.test(d['상태'])))
    &&(!q||[d['이름'],d['원어/별명'],d['직업'],d['시스템'],(d['시나리오']||[]).join(' '),d['한마디']].join(' ').toLowerCase().includes(q)));
  if(so==='img')list.sort((a,b)=>(!a.img)-(!b.img));
  if(so==='name')list.sort((a,b)=>a['이름'].localeCompare(b['이름'],'ko'));
  if(so==='plays')list.sort((a,b)=>plays(b)-plays(a));
  $('#grid').innerHTML=list.map(d=>{const R=RULES[d['서가']]||RULES.UW;return `<button class="card${LOST.test(d['상태'])?' lost':''}" data-id="${d.id}" style="--c:${R.c}">
    <div class="ph">${ph(d)}<span class="rule">${R.tag}</span>${d['상태']&&d['상태']!=='생존'?`<span class="st">${esc(d['상태'])}</span>`:''}</div>
    <div class="meta"><span class="nm">${esc(d['이름'])}</span><span class="sub">${esc(sub(d)||d['시스템'])}</span></div></button>`}).join('');
  $('#empty').hidden=list.length>0;
}
function open(id){
  const d=DATA.find(x=>x.id===id);if(!d)return close();
  const R=RULES[d['서가']]||RULES.UW;
  const info=[['시스템',d['시스템']],['시대',d['시대']],['분류',d['분류']],['성별',d['성별']],['나이',d['나이']],['국적·출신',d['국적']],['직업·역할',d['직업']],['종족',d['종족']],['이성 (현재/초기)',d['이성']],['참가',plays(d)?plays(d)+'회':'']].filter(x=>x[1]);
  const secs=[['외견',d['외견']],['성격',d['성격']],['배경',d['배경']],['비고',d['비고']]].filter(x=>x[1]);
  $('#sheet').innerHTML=`<article class="file" style="--c:${R.c}">
    <button class="close" id="x" aria-label="닫기">×</button>
    <div class="big">${ph(d)}</div>
    <div class="body">
      <div><div class="eyebrow">${esc(d.id)}</div><h2 id="dname">${esc(d['이름'])}</h2>${d['원어/별명']?`<div class="alias">${esc(d['원어/별명'])}</div>`:''}</div>
      <div class="chips"><span class="chip r">${R.tag}</span><span class="chip">${esc(d['상태']||'')}</span></div>
      ${d['한마디']?`<blockquote>${esc(d['한마디'])}</blockquote>`:''}
      <dl>${info.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${secs.map(([k,v])=>`<div class="sec"><h3>${k}</h3><p>${esc(String(v).replace(/ \/ /g,'\n'))}</p></div>`).join('')}
      ${(d['시나리오']||[]).length?`<div class="sec"><h3>함께한 시나리오</h3><ol>${d['시나리오'].map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
      ${sessFor(d)}
      <div class="src">원본 탭 · ${esc(d['원본탭']||'개요에만 있음')}</div>
    </div></article>`;
  $('#sheet').hidden=false;document.body.style.overflow='hidden';$('#x').focus();
}
function close(){$('#sheet').hidden=true;document.body.style.overflow='';}

/* ---- 비공개 세션 로그: 앱 스크립트 웹 앱이 비밀번호를 확인하고 돌려줌. 데이터는 저장소에 없음 ---- */
const LOG_URL='https://script.google.com/macros/s/AKfycbzDq0ROuPIsXvQ1wV1X5ilVRuhm6m3iM3-RxQpgiFIQVtbbSNO2tcJ4tidr4UPk9CDU3g/exec';  // 앱 스크립트 웹 앱 주소 (설정 안내 참고)
let LOGS=null;
const ss_=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){return null}};
function showLogs(on){$('#logs').hidden=!on;$('#mainlist').hidden=on;document.querySelector('.bar').hidden=on;if(on&&!LOGS&&ss_('pw'))unlock(ss_('pw'))}
async function unlock(pw){
  if(!LOG_URL){$('#pwmsg').textContent='아직 연결 전이에요.';return}
  $('#pwmsg').textContent='여는 중…';
  try{const r=await fetch(LOG_URL+'?pw='+encodeURIComponent(pw));const j=await r.json();
    if(!j.ok){$('#pwmsg').textContent='비밀번호가 맞지 않아요.';ss_('pw',null);return}
    LOGS=j.sessions||[];ss_('pw',pw);$('#pwmsg').textContent='';$('#pwform').hidden=true;$('#logbody').hidden=false;renderLogs();
  }catch(e){$('#pwmsg').textContent='불러오지 못했어요. 잠시 뒤 다시 해 보세요.'}
}
function link(l,t){return l?`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(t||'열기')}</a>`:esc(t||'')}
function vids(v,short){const L=String(v||'').split(/\n+/).map(t=>{const m=t.match(/https?:\/\/\S+/);return m?{u:m[0],t:t.replace(m[0],'').trim()}:null}).filter(Boolean);if(!L.length)return'';return L.map((x,i)=>`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">${short?(L.length>1?'▶'+(i+1):'▶ 영상'):(L.length>1?'▶ '+esc(x.t||'영상 '+(i+1)):'▶ 영상')}</a>`).join(short?' ':'<br>')}
function renderLogs(){
  const q=$('#lq').value.trim().toLowerCase();
  const L=LOGS.filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q));
  $('#logrows').innerHTML=L.map(x=>`<tr><td class="n">${esc(x['번호'])}</td><td>${esc(x['시나리오'])}</td><td>${esc(x['룰'])}</td><td>${esc(x['KP'])}</td><td>${esc(x['PL'])}</td><td>${esc(x['대장PC'])}</td><td class="n">${esc(x['날짜'])}</td><td>${esc(x['녹화'])}</td><td>${vids(x['영상'],true)}</td><td>${link(x['링크'],x['파일']?'한글 파일':'')}</td></tr>`).join('');
}
function sessFor(d){
  if(!LOGS)return '';
  const n=d['이름'].replace(/\s/g,'');
  const L=LOGS.filter(x=>(x['대장PC']||'').replace(/\(추정\)/g,'').split(/[,，]/).some(p=>p.replace(/\s/g,'')===n));
  return L.length?`<div class="sec"><h3>세션 기록 (비공개)</h3><ol class="sess">${L.map(x=>`<li>${esc(x['번호'])}. ${esc(x['시나리오'])} <span class="who">KP ${esc(x['KP'])} · PL ${esc(x['PL'])}</span> ${vids(x['영상'],false)} ${link(x['링크'],x['링크']?'한글 파일':'')}</li>`).join('')}</ol></div>`:'';
}
$('#logbtn').addEventListener('click',()=>{location.hash='logs'});
$('#logclose').addEventListener('click',()=>{location.hash=''});
$('#pwform').addEventListener('submit',e=>{e.preventDefault();unlock($('#pw').value)});
$('#lq').addEventListener('input',renderLogs);
function route(){const h=location.hash.slice(1);if(h==='logs'){close();showLogs(true);return}showLogs(false);h?open(h):close()}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)location.hash=c.dataset.id});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.id==='x'){location.hash='';close()}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)location.hash=''});
addEventListener('hashchange',route);
['q','st','sort'].forEach(i=>$('#'+i).addEventListener('input',render));
fetch('characters.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
  DATA=j.filter(d=>(d['공개']||'O')==='O');
  const cnt=k=>DATA.filter(d=>d['서가']===k).length;
  const tb=k=>`<button class="tab" aria-pressed="false" data-r="${k}"><span class="dot" style="background:${RULES[k].c}"></span>${RULES[k].name}<span class="n">${cnt(k)}</span></button>`;
  const others=Object.keys(RULES).filter(k=>!MAIN.includes(k)&&cnt(k)).sort((a,b)=>(a==='미분류')-(b==='미분류')||cnt(b)-cnt(a));
  $('#tabs').innerHTML=`<button class="tab" aria-pressed="true" data-r="">전체<span class="n">${DATA.length}</span></button>`+MAIN.map(tb).join('')+`<span class="sep" aria-hidden="true"></span>`+others.map(tb).join('');
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;rule=b.dataset.r;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t===b));render()});
  const sc=DATA.reduce((a,d)=>a+plays(d),0);
  $('#stats').innerHTML=`<span>인물 <b>${DATA.length}</b></span><span>참가 기록 <b>${sc}</b>회</span><span>그림 있음 <b>${DATA.filter(d=>d.img).length}</b></span><span>생존 <b>${DATA.filter(d=>d['상태']==='생존').length}</b></span>`;
  render();route();
}).catch(()=>{$('#empty').hidden=false;$('#empty').textContent='인물 목록을 불러오지 못했어요. 새로고침해 보세요.'});
</script>
