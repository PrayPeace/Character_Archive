<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프레이피스 캐릭터 서고</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: 서고(아카이브) 서랍. 위에 제목과 룰 서랍 탭, 아래는 인물 카드 격자, 카드를 누르면 서류철 같은 상세 패널. */
:root{
  --bg:#14171c; --panel:#1c2027; --raise:#232833; --line:#323846;
  --fg:#e9e4d8; --muted:#9b9a94; --accent:#c9a15b; --accent-ink:#1a1408;
  --coc:#6f9a7c; --coc2:#4f9aa0; --uw:#6c8fc4; --sg:#c46c6c; --etc:#a184c4; --e1:#c49a5c; --e2:#b97a9a; --e3:#8f9aa8;
  --display:"Nanum Myeongjo", "Noto Serif KR", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eeebe3; --panel:#f8f6f0; --raise:#ffffff; --line:#d6d1c4;
  --fg:#22231f; --muted:#6b6a63; --accent:#8a6424; --accent-ink:#fff8ea;
  --coc:#3f7352; --coc2:#2f7479; --uw:#3d64a0; --sg:#a14545; --etc:#77579e; --e1:#8a6424; --e2:#8f4d6e; --e3:#5a6472; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eeebe3; --panel:#f8f6f0; --raise:#ffffff; --line:#d6d1c4;
  --fg:#22231f; --muted:#6b6a63; --accent:#8a6424; --accent-ink:#fff8ea;
  --coc:#3f7352; --coc2:#2f7479; --uw:#3d64a0; --sg:#a14545; --etc:#77579e; --e1:#8a6424; --e2:#8f4d6e; --e3:#5a6472; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:40px 20px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.15;margin:.2em 0 .25em;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;background:none;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:4px;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-pressed="true"]{color:var(--fg);border-color:var(--line);background:var(--panel)}
.tab .n{font-family:var(--mono);font-size:12px;margin-left:6px;color:var(--muted)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 6px}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.tools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
input{width:min(240px,60vw)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:border-color .2s, transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph{aspect-ratio:3/4;max-width:100%;background:var(--raise);position:relative;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top center}
.ph .ini{font-family:var(--display);font-size:44px;color:var(--line)}
.ph .rule{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:2px 7px;border-radius:3px;color:#fff;background:var(--c)}
.ph .st{position:absolute;right:8px;top:8px;font-size:11px;padding:2px 7px;border-radius:3px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .nm{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.3}
.card .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.lost .ph img{filter:grayscale(.85) brightness(.8)}
.album{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x mandatory}
.album button{flex:0 0 auto;width:96px;height:128px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise);cursor:zoom-in;scroll-snap-align:start}
.album img{width:100%;height:100%;object-fit:cover;display:block}
.story{font-size:15px;line-height:1.8;margin:0}
.chron{list-style:none;margin:4px 0 0;padding:0 0 0 18px;border-left:2px solid var(--c,var(--accent))}
.chron li{position:relative;padding:2px 0 12px}
.chron li::before{content:"";position:absolute;left:-24px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--c,var(--accent))}
.chron li:last-child::before{background:var(--c,var(--accent))}
.chron .d{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
#lb{position:fixed;inset:0;z-index:60;background:rgba(5,6,8,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
#lb[hidden]{display:none}
#lb img{max-width:min(92vw,720px);max-height:82vh;object-fit:contain;border-radius:8px}
#lb p{margin:0;color:#e9e4d8;font-size:14px}
#lb .nav{display:flex;gap:10px}
#lb button{font:inherit;background:#232833;color:#e9e4d8;border:1px solid #323846;border-radius:999px;min-width:44px;height:44px;padding:0 14px;cursor:pointer}
#memo[aria-pressed="true"]{color:#e9e4d8;border-color:#9b9a94;background:#2a2d33}
body.memorial .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mcard{display:flex;gap:14px;text-align:left;font:inherit;color:inherit;background:linear-gradient(180deg,#1b1d22,#121316);border:1px solid #2e3138;border-radius:12px;padding:14px;cursor:pointer}
.mcard .mp{flex:0 0 84px;height:112px;border-radius:8px;overflow:hidden;background:#222;display:flex;align-items:center;justify-content:center}
.mcard .mp img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.85)}
.mcard .mp .ini{font-size:32px;color:#777}
.mcard b{display:block;font-family:var(--display);font-size:18px;color:#e9e4d8}
.mcard small{display:block;color:#9b9a94;font-size:12px;margin:2px 0 8px}
.mcard q{display:block;color:#cfc8b8;font-size:13px;line-height:1.6;font-style:italic}
.mcard .last{display:block;margin-top:8px;color:#8b8a84;font-size:12px}
.memohead{grid-column:1/-1;text-align:center;padding:18px 0 6px;color:var(--muted);font-family:var(--display)}
.memohead b{display:block;font-size:22px;color:var(--fg);margin-bottom:4px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
/* detail */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.file{width:min(920px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);overflow:hidden;position:relative}
.file .big{background:var(--raise);min-height:300px;display:flex;align-items:flex-start;justify-content:center}
.file .big>*{position:sticky;top:0}
.file .big img{width:100%;height:100%;object-fit:contain;object-position:top}
.file .big .ini{font-family:var(--display);font-size:90px;color:var(--line)}
.file .body{padding:28px 28px 32px;min-width:0;display:flex;flex-direction:column;gap:18px}
.close{position:absolute;z-index:6;right:10px;top:10px;box-shadow:0 2px 10px rgba(0,0,0,.35);font:inherit;font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.file h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
.alias{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.r{color:#fff;border-color:transparent;background:var(--c);font-family:var(--mono)}
blockquote{margin:0;padding:10px 0 10px 16px;border-left:2px solid var(--accent);font-family:var(--display);font-size:17px;line-height:1.6}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;font-size:14px}
dt{color:var(--muted);font-size:13px}
dd{margin:0;min-width:0}
.sec h3{font-size:12px;font-family:var(--mono);letter-spacing:.14em;color:var(--accent);margin:0 0 6px;font-weight:500}
.sec p{margin:0;white-space:pre-line;max-width:65ch}
.sec ol{margin:0;padding-left:1.3em}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.lockbtn{font:inherit;font-size:13px;margin-top:16px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.lockbtn:hover{border-color:var(--accent)}
#logs{padding-block:24px 64px}
#logs h2{font-family:var(--display);font-size:24px;margin:0 0 6px}
.logbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.log{border-collapse:collapse;width:100%;font-size:13.5px;min-width:760px}
table.log th,table.log td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.log th{font-weight:500;color:var(--muted);font-size:12px;background:var(--panel);position:sticky;top:0}
table.log td.n{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
table.log a{color:var(--accent)}
.msg{color:var(--muted);font-size:14px}
.sess li{margin-bottom:4px}
.sess .who{color:var(--muted);font-size:13px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-block:20px}
@media (max-width:700px){.close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;font-size:24px}.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.tab{white-space:nowrap}.file{grid-template-columns:1fr}.file .big{max-height:60vh}.tools{margin-left:0;width:100%}input{flex:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
/* 상세 시트 */
.statg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.stat{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--raise)}
.stat small{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.stat b{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.skills{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0;padding:0;list-style:none}
.skills li{font-size:13px;border:1px solid var(--line);border-radius:3px;padding:1px 7px}
.skills li b{font-family:var(--mono);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.skills li.hi{border-color:color-mix(in srgb,var(--c) 70%,var(--line))}
.skills li.hi b{color:var(--accent)}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
details.more[open] summary{margin-bottom:6px}

.sheettext p{margin:0 0 10px;font-size:13.5px;line-height:1.65;white-space:normal;max-width:none;overflow-wrap:anywhere}
.sheettext p+p{border-top:1px dashed var(--line);padding-top:10px}
table.wp{border-collapse:collapse;width:100%;font-size:13px}
table.wp th,table.wp td{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.wp th{font-weight:500;color:var(--muted);font-size:12px}
table.wp td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tagbtn{all:unset;cursor:pointer;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tagbtn:hover,.tagbtn:focus-visible{color:var(--fg);border-color:var(--accent)}
.tagbtn::before{content:"#";opacity:.6;margin-right:1px}
.fav{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:3px 12px;cursor:pointer}
.fav[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.ph .star{position:absolute;right:8px;bottom:8px;color:var(--accent);font-size:16px;text-shadow:0 1px 3px #0008}
#favonly[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
/* 룰별 장면: 상세를 열면 뒤 배경이 룰의 장면으로 바뀌고, 룰 이름과 인물 이름이 잠깐 떠오른 뒤 서류철이 나타남. 깜빡임 없음 */
.sheet.scened{background:transparent}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--sbg);animation:scIn .9s ease-out both}
.scene>div{position:absolute}
.scene .sc-vig{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.7) 100%)}
.scene .sc-a{inset:-20%;opacity:.5;animation:scDrift 60s linear infinite alternate}
.scene .sc-b{opacity:0;animation:scMotif 1.6s ease-out .2s forwards,scFloat 40s ease-in-out 1.8s infinite alternate}
.scene .sc-title{left:0;right:0;top:38%;text-align:center;color:#f3ead8;opacity:0;animation:scTitle 1.5s ease .15s both}
.scene .sc-title span{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:var(--sacc);margin-bottom:10px}
.scene .sc-title b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,56px);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.scene .sc-title i{display:block;width:min(70vw,380px);height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--sacc),transparent)}
.sheet.scened .file{z-index:1;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.sheet.scened .file.enter{animation-delay:.75s}
@keyframes scIn{from{opacity:0}to{opacity:1}}
@keyframes scTitle{0%{opacity:0;transform:translateY(12px)}25%{opacity:1;transform:none}70%{opacity:1}100%{opacity:.0;transform:translateY(-30px)}}
@keyframes scDrift{from{transform:translate(0,0)}to{transform:translate(-4%,3%)}}
@keyframes scMotif{from{opacity:0;transform:scale(.92)}to{opacity:var(--mo,.12);transform:none}}
@keyframes scFloat{from{translate:0 0}to{translate:-2vmin 2vmin}}
/* CoC 1920: 등불 아래 낡은 서재, 먼지, 커다란 돋보기 */
.scene.s-coc1920{--sbg:radial-gradient(900px 600px at 28% 22%,rgba(232,176,92,.32),transparent 60%),radial-gradient(700px 600px at 85% 90%,rgba(120,70,30,.35),transparent 60%),linear-gradient(160deg,#2a1b0e,#0b0705 75%);--sacc:#e0b46a}
.s-coc1920 .sc-a{background:radial-gradient(circle,rgba(255,220,160,.55) 1px,transparent 1.6px) 0 0/34px 34px,radial-gradient(circle,rgba(255,220,160,.3) 1px,transparent 1.6px) 17px 11px/53px 53px}
.s-coc1920 .sc-b{display:none}
/* CoC 현대·델타 그린: 밤의 사건 현장, 수사 격자, 사건 파일 도장 */
.scene.s-coc{--sbg:radial-gradient(900px 640px at 70% 25%,rgba(60,160,170,.25),transparent 60%),radial-gradient(800px 600px at 10% 100%,rgba(30,60,90,.4),transparent 60%),linear-gradient(170deg,#0b1a22,#05080c 75%);--sacc:#7fd0d6}
.s-coc .sc-a{opacity:.35;background:repeating-linear-gradient(0deg,rgba(127,208,214,.12) 0 1px,transparent 1px 46px),repeating-linear-gradient(90deg,rgba(127,208,214,.12) 0 1px,transparent 1px 46px)}
.s-coc .sc-b{--mo:.14;right:6vw;bottom:10vh;padding:1.2vmin 3vmin;border:.7vmin solid #d0433f;color:#d0433f;font:900 9vmin/1 var(--mono);letter-spacing:.12em;rotate:-12deg}
.s-coc .sc-b::before{content:"CASE FILE"}
/* UW: 별이 흐르는 넓은 세계, 오로라 */
.scene.s-uw{--sbg:radial-gradient(1000px 520px at 50% -5%,rgba(110,140,255,.35),transparent 65%),radial-gradient(700px 500px at 90% 80%,rgba(160,90,220,.25),transparent 60%),linear-gradient(180deg,#0c1230,#04050d 80%);--sacc:#a8c0ff}
.s-uw .sc-a{opacity:.8;background:radial-gradient(circle,#fff 1px,transparent 1.5px) 0 0/90px 90px,radial-gradient(circle,rgba(200,215,255,.7) 1px,transparent 1.6px) 40px 60px/130px 130px,radial-gradient(circle,rgba(255,255,255,.5) .8px,transparent 1.3px) 70px 20px/57px 57px}
.s-uw .sc-b{--mo:.22;left:-15vw;top:-20vh;width:130vw;height:60vh;border-radius:50%;background:radial-gradient(ellipse at 50% 100%,rgba(120,220,200,.55),transparent 60%);filter:blur(30px)}
/* 시노비가미: 먹과 붉은 띠, 忍 */
.scene.s-sg{--sbg:radial-gradient(900px 640px at 75% 30%,rgba(200,40,50,.28),transparent 60%),linear-gradient(160deg,#1c0a0c,#070405 75%);--sacc:#ff8a80}
.s-sg .sc-a{opacity:.12;background:radial-gradient(ellipse at 20% 80%,#000 0,transparent 40%),repeating-linear-gradient(-18deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px)}
.s-sg .sc-b{--mo:.13;left:4vw;top:6vh;font:800 58vmin/1 var(--display);color:#ff6b6b}
.s-sg .sc-b::before{content:"忍"}
.s-sg .sc-vig::after{content:"";position:absolute;left:-20%;width:140%;top:72%;height:7vh;background:#b3262e;opacity:.55;transform:rotate(-9deg) translateX(-110%);animation:scBand .9s cubic-bezier(.2,.9,.2,1) .1s forwards}
@keyframes scBand{to{transform:rotate(-9deg) translateX(0)}}
/* 인세인: 어둠 속 붉은 기척, 비밀 카드 */
.scene.s-insane{--sbg:radial-gradient(700px 500px at 50% 110%,rgba(170,20,30,.4),transparent 65%),linear-gradient(180deg,#0d0709,#020102 80%);--sacc:#ff6b74}
.s-insane .sc-a{opacity:.25;background:radial-gradient(circle,rgba(255,80,90,.5) 1px,transparent 1.6px) 0 0/70px 70px}
.s-insane .sc-b{--mo:.13;right:8vw;top:12vh;width:30vmin;height:44vmin;border:.5vmin solid #ff6b74;border-radius:2vmin;rotate:9deg;display:grid;place-items:center;font:800 22vmin/1 var(--display);color:#ff6b74}
.s-insane .sc-b::before{content:"?"}
/* 그 밖의 룰: 룰 색의 노을 */
.scene.s-dusk{--sbg:radial-gradient(900px 620px at 70% 20%,color-mix(in srgb,var(--c) 45%,transparent),transparent 62%),radial-gradient(800px 600px at 10% 100%,color-mix(in srgb,var(--c) 25%,transparent),transparent 60%),linear-gradient(165deg,#1a1512,#070606 78%);--sacc:color-mix(in srgb,var(--c) 60%,#fff)}
.s-dusk .sc-a{opacity:.35;background:radial-gradient(circle,rgba(255,240,220,.5) 1px,transparent 1.6px) 0 0/60px 60px}
.s-dusk .sc-b{--mo:.1;left:50%;top:50%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;border-radius:50%;border:1px solid var(--sacc);box-shadow:0 0 0 6vmin color-mix(in srgb,var(--c) 10%,transparent)}
/* 룰별 입장 연출: 한 번만, 천천히, 깜빡임 없음 */
.file.enter{animation:in-fade .45s ease-out both}
.file.enter.e-coc1920{animation:in-sepia .9s ease-out both}
.file.enter.e-coc{animation:in-folder .5s ease-out both}
.file.enter.e-sg{animation:in-scroll .75s cubic-bezier(.3,.6,.2,1) both}
.file.enter.e-insane{animation:in-card .6s cubic-bezier(.3,.7,.3,1) both;transform-origin:50% 50%}
.file.enter.e-uw{animation:in-glow .6s ease-out both}
@keyframes in-fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes in-sepia{from{opacity:0;filter:sepia(.7);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
@keyframes in-folder{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes in-scroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes in-card{from{opacity:0;transform:perspective(1200px) rotateY(-70deg)}to{opacity:1;transform:none}}
@keyframes in-glow{from{opacity:0;box-shadow:0 0 0 0 transparent}60%{box-shadow:0 0 40px -8px var(--c)}to{opacity:1;box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="dname"></div>

<script>
const RULES={CoC1920:{name:'CoC 1920년대',tag:'CoC 1920',c:'var(--coc)'},CoC현대:{name:'CoC 현대',tag:'CoC 현대',c:'var(--coc2)'},UW:{name:'언리미티드 월드',tag:'UW',c:'var(--uw)'},
SG:{name:'시노비가미',tag:'시노비가미',c:'var(--sg)'},저녁노을:{name:'저녁노을 어스름',tag:'저녁노을',c:'var(--e1)'},에모크로아:{name:'에모크로아',tag:'에모크로아',c:'var(--etc)'},
던전월드:{name:'던전 월드',tag:'던전월드',c:'var(--e2)'},아곤:{name:'아곤·조선 아곤',tag:'아곤',c:'var(--e1)'},둘수사:{name:'둘이서 수사',tag:'둘수사',c:'var(--e3)'},
너냐:{name:'너냐?!',tag:'너냐?!',c:'var(--e2)'},인세인:{name:'인세인',tag:'인세인',c:'var(--sg)'},델타그린:{name:'델타 그린',tag:'델타그린',c:'var(--coc2)'},
무협:{name:'무협',tag:'무협',c:'var(--e3)'},탐공사:{name:'탐공사',tag:'탐공사',c:'var(--etc)'},피아스코:{name:'피아스코',tag:'피아스코',c:'var(--e2)'},
TA:{name:'트라이앵글 에이전시',tag:'TA',c:'var(--e3)'},'1시간히어로':{name:'1시간 히어로',tag:'1시간 히어로',c:'var(--e1)'},미분류:{name:'시트 없음·정리 필요',tag:'미분류',c:'var(--muted)'},기타:{name:'그 밖의 룰',tag:'기타',c:'var(--muted)'}};
const MAIN=['CoC1920','CoC현대','UW'];
const LOST=/로스트|사망|격리|모험불가/;
let DATA=[],rule='',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls_=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let FAV=new Set();try{FAV=new Set(JSON.parse(ls_('fav')||'[]'))}catch(e){}
const saveFav=()=>ls_('fav',JSON.stringify([...FAV]));
// 즐겨찾기 동기화: 세션 로그 비밀번호로 한 번 열면 이 기기에 기억해 두고, 웹 앱(스크립트 속성 FAV)에 저장해 어느 기기에서나 같게 함
const favPw=()=>ls_('favpw');
function pushFav(){const pw=favPw();if(!pw||!LOG_URL)return;fetch(LOG_URL+'?op=favset&pw='+encodeURIComponent(pw)+'&ids='+encodeURIComponent([...FAV].join(','))).catch(()=>{})}
async function pullFav(pw){if(!pw||!LOG_URL)return;try{const j=await(await fetch(LOG_URL+'?op=fav&pw='+encodeURIComponent(pw))).json();if(!j.ok)return;const sv=j.fav||[];if(ls_('favsynced')){FAV=new Set(sv)}else{sv.forEach(x=>FAV.add(x));ls_('favsynced','1')}saveFav();if(FAV.size!==sv.length)pushFav();if(typeof render==='function'&&DATA.length)render()}catch(e){}}
const SCENE={CoC1920:'s-coc1920',CoC현대:'s-coc',델타그린:'s-coc',UW:'s-uw',SG:'s-sg',인세인:'s-insane'};
const ENTER={CoC1920:'e-coc1920',CoC현대:'e-coc',델타그린:'e-coc',SG:'e-sg',인세인:'e-insane',UW:'e-uw'};
function tagsOf(d){return [...new Set([d['시대'],d['직업'],d['종족'],...(d['태그']||[])].map(t=>String(t||'').trim()).filter(t=>t&&t.length<=20))]}
function sheetSec(d){
  const s=d['시트'];if(!s)return '';const o=[];
  if(s['특성치'])o.push(`<div class="sec"><h3>특성치</h3><div class="statg">${s['특성치'].map(([k,v])=>`<div class="stat"><small>${esc(k)}</small><b>${v}</b><i>${Math.floor(v/2)}/${Math.floor(v/5)}</i></div>`).join('')}</div></div>`);
  if(s['파생'])o.push(`<div class="sec"><h3>체력 · 마력 · 그 밖</h3><dl>${s['파생'].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`);
  if(s['기능']){const sk=s['기능'],top=sk.filter(x=>x[1]>=50).slice(0,16),li=x=>`<li class="${x[1]>=50?'hi':''}">${esc(x[0])}<b>${x[1]}</b></li>`;
    o.push(`<div class="sec"><h3>주요 기능</h3><ul class="skills">${(top.length?top:sk.slice(0,8)).map(li).join('')}</ul><details class="more"><summary>모든 기능 ${sk.length}개 보기</summary><ul class="skills">${sk.map(li).join('')}</ul></details></div>`)}
  if(s['무기'])o.push(`<div class="sec"><h3>무기</h3><table class="wp"><thead><tr><th>무기</th><th>성공</th><th>피해</th><th>사거리</th></tr></thead><tbody>${s['무기'].map(w=>`<tr><td>${esc(w[0])}</td><td class="n">${esc(w[1])}</td><td class="n">${esc(w[2])}</td><td>${esc(w[3])}</td></tr>`).join('')}</tbody></table></div>`);
  if(s['소지품'])o.push(`<div class="sec"><h3>소지품</h3><ul class="skills">${s['소지품'].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
  if(s['기본'])o.push(`<div class="sec"><h3>기본 수치</h3><div class="statg">${s['기본'].map(([k,v])=>`<div class="stat"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div></div>`);
  if(s['판정']){const P=s['판정'],dmg=P.filter(x=>/^피해/.test(x[0])),chk=P.filter(x=>!/^피해/.test(x[0])),mod=f=>{const m=String(f).match(/([+-]\d+)$/);return m?m[1]:f},li=x=>{const md=mod(x[1]),n=parseInt(md);return `<li class="${n>=3?'hi':''}" title="${esc(x[1])}">${esc(x[0])}<b>${esc(md===x[1]?x[1]:md)}</b></li>`};
    if(chk.length)o.push(`<div class="sec"><h3>판정</h3><ul class="skills">${chk.map(li).join('')}</ul></div>`);
    if(dmg.length)o.push(`<div class="sec"><h3>피해</h3><ul class="skills">${dmg.map(x=>`<li>${esc(x[0].replace(/^피해\(?|\)$/g,''))}<b>${esc(x[1])}</b></li>`).join('')}</ul></div>`)}
  if(s['가방'])o.push(`<div class="sec"><h3>가방</h3><table class="wp"><thead><tr><th>물품</th><th>개수</th><th>태그·효과</th></tr></thead><tbody>${s['가방'].map(w=>`<tr><td>${esc(w[0])}</td><td class="n">${esc(w[1])}</td><td>${esc(w[2])}</td></tr>`).join('')}</tbody></table></div>`);
  if(s['내용'])o.push(`<div class="sec"><h3>시트 내용</h3><div class="sheettext">${s['내용'].slice(0,2).map(b=>`<p>${b.map(esc).join('<br>')}</p>`).join('')}</div>${s['내용'].length>2?`<details class="more"><summary>시트 전체 보기</summary><div class="sheettext">${s['내용'].slice(2).map(b=>`<p>${b.map(esc).join('<br>')}</p>`).join('')}</div></details>`:''}</div>`);
  return o.join('');
}
const plays=d=>+d['시나리오횟수']||(d['시나리오']||[]).length||0;
function sub(d){return [d['직업'],d['나이']&&(d['나이']+(/\d$/.test(d['나이'])?'세':'')),d['시대']].filter(Boolean).join(' · ')}
function ph(d,cls){return d.img?`<img src="${d.img}" alt="${esc(d['이름'])}" loading="lazy">`:`<span class="ini">${esc((d['이름']||'?')[0])}</span>`}
function render(){
  const q=$('#q').value.trim().toLowerCase(),st=$('#st').value,so=$('#sort').value;
  const fo=$('#favonly').getAttribute('aria-pressed')==='true',mo=$('#memo').getAttribute('aria-pressed')==='true';document.body.classList.toggle('memorial',mo);
  let list=DATA.filter(d=>(!fo||FAV.has(d.id))&&(!mo||LOST.test(d['상태']))&&(!rule||d['서가']===rule)
    &&(!st||(st==='생존'?d['상태']==='생존':st==='lost'?LOST.test(d['상태']):d['상태']!=='생존'&&!LOST.test(d['상태'])))
    &&(!q||[d['이름'],d['원어/별명'],d['직업'],d['시스템'],(d['시나리오']||[]).join(' '),d['한마디'],d['시대'],d['종족'],(d['태그']||[]).join(' ')].join(' ').toLowerCase().includes(q)));
  if(so==='img')list.sort((a,b)=>(!a.img)-(!b.img));
  if(so==='name')list.sort((a,b)=>a['이름'].localeCompare(b['이름'],'ko'));
  if(so==='plays')list.sort((a,b)=>plays(b)-plays(a));
  if(mo){$('#grid').innerHTML=`<div class="memohead"><b>추모관</b>돌아오지 못한 이들을 기억합니다 · ${list.length}명</div>`+list.map(d=>{const C=d['연대기']||[],L=C[C.length-1],w=d['한마디']||lastLine(d);return `<button class="mcard" data-id="${d.id}"><span class="mp">${ph(d)}</span><span><b>${esc(d['이름'])}</b><small>${esc(d['상태'])} · ${esc(sub(d)||d['시스템'])}</small>${w?`<q>${esc(w)}</q>`:''}<span class="last">${L?`마지막 세션 · ${esc(L[1])}${L[2]?' ('+esc(L[2])+')':''}`:'마지막 세션 기록 없음'}</span></span></button>`}).join('');$('#empty').hidden=list.length>0;return}
  $('#grid').innerHTML=list.map(d=>{const R=RULES[d['서가']]||RULES.UW;return `<button class="card${LOST.test(d['상태'])?' lost':''}" data-id="${d.id}" style="--c:${R.c}">
    <div class="ph">${ph(d)}<span class="rule">${R.tag}</span>${d['상태']&&d['상태']!=='생존'?`<span class="st">${esc(d['상태'])}</span>`:''}${FAV.has(d.id)?'<span class="star" aria-label="즐겨찾기">★</span>':''}</div>
    <div class="meta"><span class="nm">${esc(d['이름'])}</span><span class="sub">${esc(sub(d)||d['시스템'])}</span></div></button>`}).join('');
  $('#empty').hidden=list.length>0;
}
function open(id){
  const d=DATA.find(x=>x.id===id);if(!d)return close();
  const R=RULES[d['서가']]||RULES.UW;
  const info=[['시스템',d['시스템']],['시대',d['시대']],['분류',d['분류']],['성별',d['성별']],['나이',d['나이']],['국적·출신',d['국적']],['직업·역할',d['직업']],['종족',d['종족']],['이성 (현재/초기)',d['이성']],['참가',plays(d)?plays(d)+'회':'']].filter(x=>x[1]);
  const secs=[['외견',d['외견']],['성격',d['성격']],['배경',d['배경']],['비고',d['비고']]].filter(x=>x[1]);
  const scene=`<div class="scene ${SCENE[d['서가']]||'s-dusk'}" style="--c:${R.c}" aria-hidden="true"><div class="sc-a"></div><div class="sc-b"></div><div class="sc-vig"></div><div class="sc-title"><span>${esc(R.name)}</span><b>${esc(d['이름'])}</b><i></i></div></div>`;
  $('#sheet').className='sheet scened';
  $('#sheet').innerHTML=scene+`<article class="file enter ${ENTER[d['서가']]||''}" style="--c:${R.c}">
    <button class="close" id="x" aria-label="닫기">×</button>
    <div class="big">${ph(d)}</div>
    <div class="body">
      <div><div class="eyebrow">${esc(d.id)}</div><h2 id="dname">${esc(d['이름'])}</h2>${d['원어/별명']?`<div class="alias">${esc(d['원어/별명'])}</div>`:''}</div>
      <div class="chips"><span class="chip r">${R.tag}</span><span class="chip">${esc(d['상태']||'')}</span>${tagsOf(d).map(t=>`<button class="tagbtn" type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}<button class="fav" id="favbtn" type="button" aria-pressed="${FAV.has(d.id)}">${FAV.has(d.id)?'★ 즐겨찾기됨':'☆ 즐겨찾기'}</button></div>
      ${d['한마디']?`<blockquote>${esc(d['한마디'])}</blockquote>`:''}
      <dl>${info.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${secs.map(([k,v])=>`<div class="sec"><h3>${k}</h3><p>${esc(String(v).replace(/ \/ /g,'\n'))}</p></div>`).join('')}
      ${d['이야기']?`<div class="sec"><h3>이야기</h3><p class="story">${esc(d['이야기'])}</p></div>`:''}
      ${(d['앨범']||[]).length?`<div class="sec"><h3>앨범 <small style="color:var(--muted)">${d['앨범'].length}장</small></h3><div class="album">${d['앨범'].map((a,i)=>`<button type="button" data-al="${i}" aria-label="${esc(a[1]||'그림 '+(i+1))}"><img src="${a[0]}" alt="" loading="lazy"></button>`).join('')}</div></div>`:''}
      ${sheetSec(d)}
      ${(d['연대기']||[]).length?`<div class="sec"><h3>연대기</h3><ol class="chron">${d['연대기'].map(c=>`<li><span class="d">${esc(c[2]||'날짜 미상')}${c[0]?' · 세션 '+esc(c[0]):''}</span>${esc(c[1])}</li>`).join('')}</ol></div>`:''}
      ${(d['시나리오']||[]).length?`<div class="sec"><h3>함께한 시나리오</h3><ol>${d['시나리오'].map(s=>`<li><button class="tagbtn" type="button" data-tag="${esc(s)}">${esc(s)}</button></li>`).join('')}</ol></div>`:''}
      ${sessFor(d)}
      <div class="src">원본 탭 · ${esc(d['원본탭']||'개요에만 있음')}</div>
    </div></article>`;
  $('#sheet').hidden=false;document.body.style.overflow='hidden';const fe=$('#sheet .file');fe.addEventListener('animationend',()=>fe.classList.remove('enter',...Object.values(ENTER)),{once:true});$('#x').focus();
}
function close(){$('#sheet').hidden=true;document.body.style.overflow='';}

/* ---- 비공개 세션 로그: 앱 스크립트 웹 앱이 비밀번호를 확인하고 돌려줌. 데이터는 저장소에 없음 ---- */
const LOG_URL='https://script.google.com/macros/s/AKfycbzDq0ROuPIsXvQ1wV1X5ilVRuhm6m3iM3-RxQpgiFIQVtbbSNO2tcJ4tidr4UPk9CDU3g/exec';  // 앱 스크립트 웹 앱 주소 (설정 안내 참고)
let LOGS=null;
const ss_=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){return null}};
function showLogs(on){$('#logs').hidden=!on;$('#mainlist').hidden=on;document.querySelector('.bar').hidden=on;if(on&&!LOGS&&ss_('pw'))unlock(ss_('pw'))}
async function unlock(pw){
  if(!LOG_URL){$('#pwmsg').textContent='아직 연결 전이에요.';return}
  $('#pwmsg').textContent='여는 중…';
  try{const r=await fetch(LOG_URL+'?pw='+encodeURIComponent(pw));const j=await r.json();
    if(!j.ok){$('#pwmsg').textContent='비밀번호가 맞지 않아요.';ss_('pw',null);return}
    LOGS=j.sessions||[];ss_('pw',pw);if(favPw()!==pw){ls_('favpw',pw);pullFav(pw)}$('#pwmsg').textContent='';$('#pwform').hidden=true;$('#logbody').hidden=false;renderLogs();
  }catch(e){$('#pwmsg').textContent='불러오지 못했어요. 잠시 뒤 다시 해 보세요.'}
}
function link(l,t){return l?`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(t||'열기')}</a>`:esc(t||'')}
function vids(v,short){const L=String(v||'').split(/\n+/).map(t=>{const m=t.match(/https?:\/\/\S+/);return m?{u:m[0],t:t.replace(m[0],'').trim()}:null}).filter(Boolean);if(!L.length)return'';return L.map((x,i)=>`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">${short?(L.length>1?'▶'+(i+1):'▶ 영상'):(L.length>1?'▶ '+esc(x.t||'영상 '+(i+1)):'▶ 영상')}</a>`).join(short?' ':'<br>')}
function renderLogs(){
  const q=$('#lq').value.trim().toLowerCase();
  const L=LOGS.filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q));
  $('#logrows').innerHTML=L.map(x=>`<tr><td class="n">${esc(x['번호'])}</td><td>${esc(x['시나리오'])}</td><td>${esc(x['룰'])}</td><td>${esc(x['KP'])}</td><td>${esc(x['PL'])}</td><td>${esc(x['대장PC'])}</td><td class="n">${esc(x['날짜'])}</td><td>${esc(x['녹화'])}</td><td>${vids(x['영상'],true)}</td><td>${link(x['링크'],x['파일']?'한글 파일':'')}</td></tr>`).join('');
}
function sessFor(d){
  if(!LOGS)return '';
  const n=d['이름'].replace(/\s/g,'');
  const L=LOGS.filter(x=>(x['대장PC']||'').replace(/\(추정\)/g,'').split(/[,，]/).some(p=>p.replace(/\s/g,'')===n));
  return L.length?`<div class="sec"><h3>세션 기록 (비공개)</h3><ol class="sess">${L.map(x=>`<li>${esc(x['번호'])}. ${esc(x['시나리오'])} <span class="who">KP ${esc(x['KP'])} · PL ${esc(x['PL'])}</span> ${vids(x['영상'],false)} ${link(x['링크'],x['링크']?'한글 파일':'')}</li>`).join('')}</ol></div>`:'';
}
$('#logbtn').addEventListener('click',()=>{location.hash='logs'});
$('#logclose').addEventListener('click',()=>{location.hash=''});
$('#pwform').addEventListener('submit',e=>{e.preventDefault();unlock($('#pw').value)});
$('#lq').addEventListener('input',renderLogs);
function route(){const h=location.hash.slice(1);if(h==='logs'){close();showLogs(true);return}showLogs(false);h?open(h):close()}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card,.mcard');if(c)location.hash=c.dataset.id});
$('#sheet').addEventListener('click',e=>{
  if(e.target.id==='sheet'||e.target.id==='x'){location.hash='';close();return}
  const t=e.target.closest('.tagbtn');if(t){$('#q').value=t.dataset.tag;rule='';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===''));location.hash='';close();render();$('#q').focus();return}
  const al=e.target.closest('[data-al]');if(al){lbOpen(DATA.find(x=>x.id===location.hash.slice(1)),+al.dataset.al);return}
  if(e.target.id==='favbtn'){const id=location.hash.slice(1);FAV.has(id)?FAV.delete(id):FAV.add(id);saveFav();pushFav();e.target.setAttribute('aria-pressed',FAV.has(id));e.target.textContent=FAV.has(id)?'★ 즐겨찾기됨':'☆ 즐겨찾기';render()}
});
$('#favonly').addEventListener('click',e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');render()});
$('#memo').addEventListener('click',e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');render();scrollTo(0,0)});
function lastLine(d){const s=d['이야기']||'';const m=s.match(/'([^']{4,60})'/g);return m?m[m.length-1].slice(1,-1):''}
let LB=null;
function lbShow(){const a=LB.d['앨범'][LB.i];$('#lb img').src=a[0];$('#lb img').alt=a[1]||LB.d['이름'];$('#lb p').textContent=`${a[1]||LB.d['이름']} · ${LB.i+1}/${LB.d['앨범'].length}`}
function lbOpen(d,i){if(!d)return;LB={d,i};lbShow();$('#lb').hidden=false;$('#lb [data-k="0"]').focus()}
function lbClose(){$('#lb').hidden=true;LB=null}
$('#lb').addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(!k){if(e.target.id==='lb')lbClose();return}const n=+k.dataset.k;if(!n)return lbClose();const L=LB.d['앨범'].length;LB.i=(LB.i+n+L)%L;lbShow()});
addEventListener('keydown',e=>{if(LB){if(e.key==='Escape')lbClose();if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const L=LB.d['앨범'].length;LB.i=(LB.i+(e.key==='ArrowRight'?1:-1)+L)%L;lbShow()}return}if(e.key==='Escape'&&!$('#sheet').hidden)location.hash=''});
addEventListener('hashchange',route);
['q','st','sort'].forEach(i=>$('#'+i).addEventListener('input',render));
fetch('characters.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
  DATA=j.filter(d=>(d['공개']||'O')==='O');
  pullFav(favPw());
  const cnt=k=>DATA.filter(d=>d['서가']===k).length;
  const tb=k=>`<button class="tab" aria-pressed="false" data-r="${k}"><span class="dot" style="background:${RULES[k].c}"></span>${RULES[k].name}<span class="n">${cnt(k)}</span></button>`;
  const others=Object.keys(RULES).filter(k=>!MAIN.includes(k)&&cnt(k)).sort((a,b)=>(a==='미분류')-(b==='미분류')||cnt(b)-cnt(a));
  $('#tabs').innerHTML=`<button class="tab" aria-pressed="true" data-r="">전체<span class="n">${DATA.length}</span></button>`+MAIN.map(tb).join('')+`<span class="sep" aria-hidden="true"></span>`+others.map(tb).join('');
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;rule=b.dataset.r;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t===b));render()});
  const sc=DATA.reduce((a,d)=>a+plays(d),0);
  $('#stats').innerHTML=`<span>인물 <b>${DATA.length}</b></span><span>참가 기록 <b>${sc}</b>회</span><span>그림 있음 <b>${DATA.filter(d=>d.img).length}</b></span><span>생존 <b>${DATA.filter(d=>d['상태']==='생존').length}</b></span>`;
  render();route();
}).catch(()=>{$('#empty').hidden=false;$('#empty').textContent='인물 목록을 불러오지 못했어요. 새로고침해 보세요.'});
</script>
