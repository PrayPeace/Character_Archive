name: 모음집 반영
on:
  push:
    branches: [main]
    paths: ['sync/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pillow
      - name: 모음집 글자를 캐릭터 목록에 합치기
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: bash tools/sync.sh
      - name: 바뀐 내용 올리기
        run: |
          git config user.name "character-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters.json img
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "모음집 반영: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
